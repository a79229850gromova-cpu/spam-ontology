<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Онтология: Фейковые сообщения и спам</title>
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #faf8f5; font-family: Georgia, serif; overflow: hidden;
    }
    #cy { width: 100%; height: 100%; }
    #info-panel {
      position: absolute; top: 20px; left: 20px; width: 320px;
      background: rgba(255, 253, 249, 0.96);
      border: 1.5px solid #5c6b73; border-radius: 10px;
      padding: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      color: #1f2421; z-index: 10;
    }
    #info-panel h3 { margin: 0 0 8px 0; font-size: 16px; color: #1d3557; }
    #info-panel p { margin: 0 0 12px 0; font-size: 13px; line-height: 1.45; }
    .controls { display: flex; gap: 8px; }
    button {
      background: #1d3557; color: #faf8f5; border: none;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
      font-family: inherit; font-size: 12px;
    }
    button:hover { background: #2b4c7e; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; background: #e9e2d0; margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div id="info-panel">
  <div class="badge" id="node-group">Интерактивная онтология</div>
  <h3 id="node-title">Нажми на любой блок</h3>
  <p id="node-desc">Кликни по элементу схемы, чтобы подсветить все связанные с ним каналы, атаки, инструменты и меры защиты. Пустое место — сброс выделения.</p>
  <div class="controls">
    <button onclick="resetView()">Сбросить выделение</button>
    <button onclick="cy.fit(null, 40)">Вся схема</button>
  </div>
</div>

<div id="cy"></div>

          'label': 'data(label)',
          'text-valign': 'center',
          'text-halign': 'center',
          'text-wrap': 'wrap',
          'text-max-width': '160px',
          'font-family': 'Georgia, serif',
          'font-size': '11px',
          'padding': '10px',
          'width': 'label',
          'height': 'label',
          'transition-property': 'opacity, border-width, border-color',
          'transition-duration': '0.2s'
        }
      },
      {
        selector: 'edge',
        style: {
          'width': 1.5,
          'line-color': '#8d99ae',
          'target-arrow-color': '#8d99ae',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'label': 'data(label)',
          'font-size': '9px',
          'color': '#4a5568',
          'text-background-color': '#faf8f5',
          'text-background-opacity': 0.85,
          'text-background-padding': '2px',
          'transition-property': 'opacity, line-color, width',
          'transition-duration': '0.2s'
        }
      },
      {
        selector: 'edge[?cross]',
        style: {
          'line-style': 'dashed',
          'line-color': '#b56576',
          'target-arrow-color': '#b56576'
        }
      },
      {
        selector: '.dimmed',
        style: { 'opacity': 0.15 }
      },
      {
        selector: '.highlighted',
        style: {
          'opacity': 1,
          'border-width': 3.5,
          'border-color': '#d62828',
          'z-index': 999
        }
      },
      {
        selector: 'edge.highlighted',
        style: {
          'opacity': 1,
          'width': 3,
          'line-color': '#d62828',
          'target-arrow-color': '#d62828',
          'z-index': 999
        }
      }
    ],
    layout: {
      name: 'breadthfirst',
      directed: true,
      roots: '#ROOT',
      padding: 40,
      spacingFactor: 1.25
    }
  });

  // Клик по узлу: подсветка соседей и вывод описания
  cy.on('tap', 'node', function(evt) {
    const node = evt.target;
    const neighborhood = node.closedNeighborhood();

    cy.elements().addClass('dimmed').removeClass('highlighted');
    neighborhood.removeClass('dimmed').addClass('highlighted');

    document.getElementById('node-group').textContent = node.data('group');
    document.getElementById('node-title').textContent = node.data('label').replace(/\n/g, ' ');
    document.getElementById('node-desc').textContent = node.data('desc');
  });

  // Клик по пустому месту: сброс
  cy.on('tap', function(evt) {
    if (evt.target === cy) resetView();
  });

  function resetView() {
    cy.elements().removeClass('dimmed highlighted');
    document.getElementById('node-group').textContent = 'Интерактивная онтология';
    document.getElementById('node-title').textContent = 'Нажми на любой блок';
    document.getElementById('node-desc').textContent = 'Кликни по элементу схемы, чтобы подсветить все связанные с ним каналы, атаки, инструменты и меры защиты. Пустое место — сброс выделения.';
  }
</script>

</body>
</html>

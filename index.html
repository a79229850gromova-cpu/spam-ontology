<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Онтология: Фейковые сообщения и спам</title>
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top left, #fdfbf7 0%, #f3efe6 100%);
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
    }
    #cy {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #cy:active {
      cursor: grabbing;
    }
    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 340px;
      background: rgba(255, 253, 249, 0.94);
      backdrop-filter: blur(8px);
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      color: #1e293b;
      z-index: 10;
      transition: all 0.25s ease;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.3px;
      background: #e2e8f0;
      color: #1e3a8a;
      margin-bottom: 10px;
    }
    #info-panel h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
      line-height: 1.3;
      color: #0f172a;
    }
    #info-panel p {
      margin: 0 0 14px 0;
      font-size: 13px;
      line-height: 1.5;
      color: #475569;
    }
    .hint {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 12px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    button {
      background: #1e3a8a;
      color: #ffffff;
      border: none;
      padding: 7px 13px;
      border-radius: 7px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:active {
      transform: scale(0.98);
    }
    button.secondary {
      background: #e2e8f0;
      color: #1e293b;
    }
    button.secondary:hover {
      background: #cbd5e1;
    }
  </style>
</head>
<body>

<div id="info-panel">
  <div class="badge" id="node-group">Онтология угроз и защиты</div>
  <h3 id="node-title">Фейковые сообщения и спам</h3>
  <p id="node-desc">Нажми на любой блок, чтобы подсветить все его связи. Любой элемент можно перетащить мышкой в сторону для удобного просмотра — структура связей при этом не нарушится.</p>
  <div class="hint">• Клик по фону — сбросить подсветку<br>• Колёсико мыши — приблизить или отдалить</div>
  <div class="controls">
    <button onclick="resetView()">Сбросить подсветку</button>
    <button class="secondary" onclick="cy.fit(null, 45)">Вся схема</button>
  </div>
</div>

<div id="cy"></div>

    { data: { source: 'CHAR', target: 'C3' } }, { data: { source: 'CHAR', target: 'C4' } },
    { data: { source: 'CHAR', target: 'C5' } }, { data: { source: 'CHAR', target: 'C6' } },

    { data: { source: 'CHAN', target: 'CH_MAIL' } }, { data: { source: 'CHAN', target: 'CH_MOB' } },
    { data: { source: 'CHAN', target: 'CH_IP' } }, { data: { source: 'CHAN', target: 'CH_WEB' } },
    { data: { source: 'CHAN', target: 'CH_OFF' } },

    { data: { source: 'TYPES', target: 'T_PHISH' } }, { data: { source: 'TYPES', target: 'T_BEC' } },
    { data: { source: 'TYPES', target: 'T_IMP' } }, { data: { source: 'TYPES', target: 'T_INV' } },
    { data: { source: 'TYPES', target: 'T_CB' } }, { data: { source: 'TYPES', target: 'T_SS7' } },
    { data: { source: 'T_SS7', target: 'SS7_FAKE' } }, { data: { source: 'T_SS7', target: 'SS7_SPOOF' } },
    { data: { source: 'T_SS7', target: 'SS7_OPEN' } }, { data: { source: 'T_SS7', target: 'SS7_DOS' } },

    { data: { source: 'TECH', target: 'TC_AI' } }, { data: { source: 'TECH', target: 'TC_PHAAS' } },
    { data: { source: 'TECH', target: 'TC_MAL' } }, { data: { source: 'TECH', target: 'TC_SIM' } },
    { data: { source: 'TECH', target: 'TC_BOT' } }, { data: { source: 'TECH', target: 'TC_REL' } },

    { data: { source: 'GOALS', target: 'G_DATA' } }, { data: { source: 'GOALS', target: 'G_FIN' } },
    { data: { source: 'GOALS', target: 'G_SUB' } }, { data: { source: 'GOALS', target: 'G_INF' } },
    { data: { source: 'GOALS', target: 'G_VIC' } },

    { data: { source: 'DEF', target: 'D_ITU' } }, { data: { source: 'DEF', target: 'D_GSMA' } },
    { data: { source: 'DEF', target: 'D_REG' } },
    { data: { source: 'D_ITU', target: 'D_INFRA' } }, { data: { source: 'D_ITU', target: 'D_SERV' } },
    { data: { source: 'D_ITU', target: 'D_APP' } },
    { data: { source: 'D_GSMA', target: 'G_MON' } }, { data: { source: 'D_GSMA', target: 'G_PREV' } },
    { data: { source: 'D_REG', target: 'R_ANTI' } }, { data: { source: 'D_REG', target: 'R_TEL' } },
    { data: { source: 'D_REG', target: 'R_WEB' } }, { data: { source: 'D_REG', target: 'R_UX' } },

    // Перекрёстные связи (пунктир)
    { data: { source: 'T_PHISH', target: 'TC_PHAAS', label: 'использует', cross: true } },
    { data: { source: 'T_PHISH', target: 'CH_WEB', label: 'ведёт на', cross: true } },
    { data: { source: 'T_BEC', target: 'TC_AI', label: 'усиливается', cross: true } },
    { data: { source: 'T_BEC', target: 'CH_MAIL', label: 'использует', cross: true } },
    { data: { source: 'T_CB', target: 'CH_IP', label: 'использует', cross: true } },
    { data: { source: 'T_CB', target: 'G_DATA', label: 'перехватывает', cross: true } },
    { data: { source: 'SS7_FAKE', target: 'G_MON', label: 'выявляется', cross: true } },
    { data: { source: 'SS7_FAKE', target: 'G_PREV', label: 'блокируется', cross: true } },
    { data: { source: 'SS7_OPEN', target: 'G_PREV', label: 'блокируется', cross: true } },
    { data: { source: 'TC_MAL', target: 'G_FIN', label: 'обеспечивает', cross: true } },
    { data: { source: 'TC_SIM', target: 'G_DATA', label: 'обеспечивает', cross: true } },
    { data: { source: 'R_UX', target: 'D_APP', label: 'наполняет', cross: true } }
  ];

  const cy = cytoscape({
    container: document.getElementById('cy'),
    elements: elements,
    autoungrabify: false, // Разрешает свободно двигать блоки мышкой
    autounselectify: false,
    style: [
      {
        selector: 'node',
        style: {
          'shape': 'round-rectangle',
          'background-color': 'data(bg)',
          'border-color': 'data(border)',
          'border-width': 2,
          'color': 'data(color)',
          'label': 'data(label)',
          'text-valign': 'center',
          'text-halign': 'center',
          'text-wrap': 'wrap',
          'text-max-width': '165px',
          'font-family': 'Georgia, serif',
          'font-size': function(ele) { return ele.data('size') || '11px'; },
          'padding': function(ele) { return ele.data('pad') || '10px'; },
          'width': 'label',
          'height': 'label',
          'shadow-blur': 10,
          'shadow-color': 'rgba(15, 23, 42, 0.12)',
          'shadow-offset-x': 0,
          'shadow-offset-y': 3,
          'transition-property': 'opacity, border-width, border-color, shadow-blur',
          'transition-duration': '0.2s'
        }
      },
      {
        selector: 'edge',
        style: {
          'width': 1.6,
          'line-color': '#94a3b8',
          'target-arrow-color': '#94a3b8',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'label': 'data(label)',
          'font-size': '9.5px',
          'color': '#334155',
          'text-background-color': '#faf8f5',
          'text-background-opacity': 0.9,
          'text-background-padding': '2px',
          'transition-property': 'opacity, line-color, width',
          'transition-duration': '0.2s'
        }
      },
      {
        selector: 'edge[?cross]',
        style: {
          'line-style': 'dashed',
          'line-dash-pattern': [6, 4],
          'line-color': '#be185d',
          'target-arrow-color': '#be185d',
          'color': '#9d174d'
        }
      },
      {
        selector: '.dimmed',
        style: {
          'opacity': 0.14
        }
      },
      {
        selector: 'node.highlighted',
        style: {
          'opacity': 1,
          'border-width': 3.5,
          'border-color': '#ea580c',
          'shadow-blur': 18,
          'shadow-color': 'rgba(234, 88, 12, 0.45)',
          'z-index': 999
        }
      },
      {
        selector: 'node.active-center',
        style: {
          'border-width': 4.5,
          'border-color': '#dc2626'
        }
      },
      {
        selector: 'edge.highlighted',
        style: {
          'opacity': 1,
          'width': 3.2,
          'line-color': '#ea580c',
          'target-arrow-color': '#ea580c',
          'z-index': 999
        }
      }
    ],
    layout: {
      name: 'breadthfirst',
      directed: true,
      roots: '#ROOT',
      padding: 45,
      spacingFactor: 1.3
    }
  });

  // Клик или захват узла: подсветка и вывод карточки
  cy.on('tap dragstart', 'node', function(evt) {
    const node = evt.target;
    const neighborhood = node.closedNeighborhood();

    cy.elements().addClass('dimmed').removeClass('highlighted active-center');
    neighborhood.removeClass('dimmed').addClass('highlighted');
    node.addClass('active-center');

    document.getElementById('node-group').textContent = node.data('group');
    document.getElementById('node-title').textContent = node.data('label').replace(/\n/g, ' ');
    document.getElementById('node-desc').textContent = node.data('desc');
  });

  // Клик по пустому фону: сброс выделения
  cy.on('tap', function(evt) {
    if (evt.target === cy) resetView();
  });

  function resetView() {
    cy.elements().removeClass('dimmed highlighted active-center');
    document.getElementById('node-group').textContent = 'Онтология угроз и защиты';
    document.getElementById('node-title').textContent = 'Фейковые сообщения и спам';
    document.getElementById('node-desc').textContent = 'Нажми на любой блок, чтобы подсветить все его связи. Любой элемент можно перетащить мышкой в сторону для удобного просмотра — структура связей при этом не нарушится.';
  }
</script>

</body>
